<script id="state-data" type="application/json">{"version":1,"subjects":[],"sessions":[],"activeSession":null,"todos":[],"goals":{"dailyMinutes":null,"weeklyMinutes":null}}</script>
<script>
(function(){
"use strict";

/* ---------- capture own source verbatim (for self-republishing) ---------- */
var APP_SRC = document.currentScript.textContent;
var LT_SLASH_SCRIPT = "<" + "/script>";

/* ---------- static head (must mirror the real <head> above, minus fonts already loaded) ---------- */
var HEAD_HTML = "";

function serializeDocument(state){
  var stateJson = JSON.stringify(state).replace(/</g, "\\u003c");
  var tail = LT_SLASH_SCRIPT + "\n<script>" + APP_SRC + LT_SLASH_SCRIPT + "\n</body>\n</html>";
  return HEAD_HTML + stateJson + tail;
}

/* ---------- state ---------- */
var LS_KEY = "study-ledger-v1";
var STATE = JSON.parse(document.getElementById("state-data").textContent);
var artifactApi = null;
var artifactChecked = false;
var sampleApi = null;
var downloadsApi = null;
var capsReady = { sample: false, downloads: false };
var UI = { tab: "timer", statsPeriod: "week", mode: "stopwatch", subjectId: null, presetMin: 25, customMin: "", newNote: "", dash: { goals: true, trends: true, heatmap: true, ai: true, export: true, rhythm: true, balance: true } };
var tickHandle = null;
var toastTimer = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function loadLocalBackup(){
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return null;
}
function saveLocalBackup(state){
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
}

/* ---------- appearance (per-device UI preference, not app data) ---------- */
var THEME_KEY = "study-tracker-theme-v1";
function getThemePref(){
  try {
    var v = localStorage.getItem(THEME_KEY);
    if (v === "light" || v === "dark" || v === "auto") return v;
  } catch(e){}
  return "auto";
}
function setThemePref(pref){
  try { localStorage.setItem(THEME_KEY, pref); } catch(e){}
}
function applyTheme(pref){
  if (pref === "light" || pref === "dark") document.documentElement.setAttribute("data-theme", pref);
  else document.documentElement.removeAttribute("data-theme");
  var metaLight = document.querySelector('meta[name="theme-color"][media*="light"]');
  var metaDark = document.querySelector('meta[name="theme-color"][media*="dark"]');
  var bg = pref === "dark" ? "#0C0B16" : (pref === "light" ? "#F5F3FC" : null);
  if (bg && metaLight) metaLight.setAttribute("content", bg);
  if (bg && metaDark) metaDark.setAttribute("content", bg);
}

/* ---------- which screen you're on (per-device UI preference, not app data) ----------
   Publishing a self-persisted update makes the artifact viewer reload to the
   freshly published version, which re-runs this whole script from scratch and
   would otherwise always land back on the Timer tab (UI's default). Stashing
   the current tab here and restoring it on boot means a reload caused by
   adding a task, checking something off, etc. keeps you on the same screen
   instead of visibly jumping back to Timer. */
var UI_KEY = "study-tracker-ui-v1";
var KNOWN_TABS = ["timer", "todo", "stats", "history", "settings"];
var KNOWN_PERIODS = ["week", "month", "year", "all"];
var DASH_KEYS = ["goals", "trends", "heatmap", "ai", "export", "rhythm", "balance"];
function restoreUIPref(){
  try {
    var v = JSON.parse(localStorage.getItem(UI_KEY));
    if (v && typeof v === "object"){
      if (KNOWN_TABS.indexOf(v.tab) !== -1) UI.tab = v.tab;
      if (KNOWN_PERIODS.indexOf(v.statsPeriod) !== -1) UI.statsPeriod = v.statsPeriod;
      if (v.dash && typeof v.dash === "object"){
        DASH_KEYS.forEach(function(k){ if (typeof v.dash[k] === "boolean") UI.dash[k] = v.dash[k]; });
      }
    }
  } catch(e){}
}
function saveUIPref(){
  try { localStorage.setItem(UI_KEY, JSON.stringify({ tab: UI.tab, statsPeriod: UI.statsPeriod, dash: UI.dash })); } catch(e){}
}

/* ---------- subjects / colors ---------- */
var HUES = ["pine","moss","clay","amber","plum","berry","slate","gold"];
function hueLabel(h){ return h.charAt(0).toUpperCase() + h.slice(1); }
function nextHue(){
  var counts = {};
  HUES.forEach(function(h){ counts[h] = 0; });
  STATE.subjects.forEach(function(s){ if (counts.hasOwnProperty(s.hue)) counts[s.hue]++; });
  var best = HUES[0];
  HUES.forEach(function(h){ if (counts[h] < counts[best]) best = h; });
  return best;
}
function findSubject(id){
  for (var i=0;i<STATE.subjects.length;i++){ if (STATE.subjects[i].id === id) return STATE.subjects[i]; }
  return null;
}
function findTodo(id){
  for (var i=0;i<STATE.todos.length;i++){ if (STATE.todos[i].id === id) return STATE.todos[i]; }
  return null;
}

/* ---------- time helpers ---------- */
function pad2(n){ return (n<10?"0":"")+n; }
function dateKey(ts){
  var d = new Date(ts);
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
}
function todayKey(){ return dateKey(Date.now()); }
function startOfDay(ts){ var d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
function dayLabel(ts){ return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date(ts).getDay()]; }
function fullDateLabel(ts){
  var d = new Date(ts);
  var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return months[d.getMonth()] + " " + d.getDate();
}
function longDateLabel(ts){
  var d = new Date(ts);
  var weekdays = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  return weekdays[d.getDay()] + ", " + months[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
}
function monthLabel(ts){
  var d = new Date(ts);
  var months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  return months[d.getMonth()] + " " + d.getFullYear();
}
function monthAbbr(idx){ return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][idx]; }
function daysInMonth(year, monthIdx){ return new Date(year, monthIdx+1, 0).getDate(); }
function timeLabel(ts){
  var d = new Date(ts);
  var h = d.getHours(); var m = pad2(d.getMinutes());
  var ampm = h >= 12 ? "PM" : "AM";
  var h12 = h % 12; if (h12 === 0) h12 = 12;
  return h12 + ":" + m + " " + ampm;
}
function fmtDuration(totalSec){
  totalSec = Math.max(0, Math.round(totalSec));
  var h = Math.floor(totalSec/3600);
  var m = Math.floor((totalSec%3600)/60);
  if (h > 0) return h + "h " + pad2(m) + "m";
  if (m > 0) return m + "m";
  return Math.round(totalSec) + "s";
}
function fmtMinutesShort(totalSec){
  var m = Math.round(totalSec/60);
  return m + "m";
}
function fmtClock(totalSec){
  totalSec = Math.max(0, Math.round(totalSec));
  var h = Math.floor(totalSec/3600);
  var m = Math.floor((totalSec%3600)/60);
  var s = totalSec%60;
  if (h > 0) return h + ":" + pad2(m) + ":" + pad2(s);
  return pad2(m) + ":" + pad2(s);
}

/* ---------- derived stats ---------- */
function secondsOn(dayStart){
  return sessionsOn(dayStart).reduce(function(a,s){ return a + s.durationSec; }, 0);
}
function sessionsInRange(startTs, endTs){
  return STATE.sessions.filter(function(s){ return s.startedAt >= startTs && s.startedAt < endTs; });
}
function secondsInRange(startTs, endTs){
  return sessionsInRange(startTs, endTs).reduce(function(a,s){ return a + s.durationSec; }, 0);
}
function subjectDistribution(sessions){
  var map = {}; var order = [];
  sessions.forEach(function(s){
    /* group by name first so two sessions for the same subject always combine
       into one slice even if they carry mismatched subjectIds (e.g. a
       manually-recovered session) — name is what's actually shown, so it's
       the truer key. */
    var key = s.subjectName || ("id:" + s.subjectId);
    if (!map[key]){ map[key] = { name: s.subjectName, hue: s.subjectHue, sec: 0 }; order.push(key); }
    map[key].sec += s.durationSec;
  });
  var list = order.map(function(k){ return map[k]; });
  list.sort(function(a,b){ return b.sec - a.sec; });
  return list;
}

/* ---------- dashboard: goals, trends, heatmap, AI insights, export ---------- */
function getGoals(){
  return STATE.goals || { dailyMinutes: null, weeklyMinutes: null };
}
function trendDelta(cur, prev){
  if (prev <= 0) return cur > 0 ? { pct: null, dir: "up", label: "New" } : { pct: null, dir: "flat", label: "No change" };
  var pct = Math.round(((cur - prev) / prev) * 100);
  if (pct > 0) return { pct: pct, dir: "up", label: "+" + pct + "% vs prior" };
  if (pct < 0) return { pct: pct, dir: "down", label: pct + "% vs prior" };
  return { pct: 0, dir: "flat", label: "No change" };
}
function trendBadge(delta){
  var cls = delta.dir === "up" ? "badge-good" : (delta.dir === "down" ? "badge-warn" : "badge-neutral");
  return '<span class="badge ' + cls + '">' + escapeHtml(delta.label) + '</span>';
}
function showGoalsModal(){
  var goals = getGoals();
  var root = document.getElementById("modalRoot");
  root.innerHTML =
    '<div class="modal-backdrop" id="modalBackdrop">' +
      '<div class="modal-card" role="dialog" aria-modal="true">' +
        '<h3 class="modal-title">Study Goals</h3>' +
        '<p class="modal-body">Set a target and track progress on the Stats page. Leave a field blank to turn that goal off.</p>' +
        '<div class="form-field"><label>Daily minutes</label><input type="number" min="1" max="1440" id="goalDaily" placeholder="e.g. 60" value="' + (goals.dailyMinutes != null ? goals.dailyMinutes : "") + '"></div>' +
        '<div class="form-field"><label>Weekly minutes</label><input type="number" min="1" max="10080" id="goalWeekly" placeholder="e.g. 300" value="' + (goals.weeklyMinutes != null ? goals.weeklyMinutes : "") + '"></div>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-ghost" id="modalCancel">Cancel</button>' +
          '<button class="btn btn-primary" id="modalSaveGoals">Save</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.getElementById("modalCancel").onclick = closeModal;
  document.getElementById("modalBackdrop").onclick = function(e){ if (e.target.id === "modalBackdrop") closeModal(); };
  document.getElementById("modalSaveGoals").onclick = function(){
    var dRaw = document.getElementById("goalDaily").value.trim();
    var wRaw = document.getElementById("goalWeekly").value.trim();
    var d = dRaw === "" ? null : Math.max(1, Math.round(Number(dRaw)));
    var w = wRaw === "" ? null : Math.max(1, Math.round(Number(wRaw)));
    if (dRaw !== "" && isNaN(d)) d = null;
    if (wRaw !== "" && isNaN(w)) w = null;
    STATE.goals = { dailyMinutes: d, weeklyMinutes: w };
    closeModal();
    persist(); render();
  };
}
function buildAiPrompt(){
  var cmp = computeComparison();
  var dist7 = subjectDistribution(inWindow(STATE.sessions, 7));
  var distAll = subjectDistribution(STATE.sessions);
  var goals = getGoals();
  var lines = [];
  lines.push("You are looking at a student's study-tracking data. Give 2-4 short, specific, encouraging sentences of observations or suggestions based on the data below. Plain text only, no markdown, no bullet points.");
  lines.push("");
  lines.push("Last 7 days total: " + fmtDuration(cmp.week.cur) + " (previous 7 days: " + fmtDuration(cmp.week.prev) + ")");
  lines.push("This month total: " + fmtDuration(cmp.month.cur) + " (previous month: " + fmtDuration(cmp.month.prev) + ")");
  lines.push("Current streak: " + computeStreak() + " day(s). Best streak ever: " + computeBestStreak() + " day(s).");
  if (goals.dailyMinutes != null) lines.push("Daily goal: " + goals.dailyMinutes + " minutes.");
  if (goals.weeklyMinutes != null) lines.push("Weekly goal: " + goals.weeklyMinutes + " minutes.");
  lines.push("");
  lines.push("Time of day pattern: " + rhythmFinding().plain);
  lines.push("Time by subject, last 7 days:");
  if (dist7.length){
    dist7.forEach(function(d){ lines.push("- " + d.name + ": " + fmtDuration(d.sec)); });
  } else {
    lines.push("- (no sessions in the last 7 days)");
  }
  lines.push("");
  lines.push("Time by subject, all time:");
  distAll.forEach(function(d){ lines.push("- " + d.name + ": " + fmtDuration(d.sec)); });
  return lines.join("\n");
}
function runAiInsight(){
  if (!sampleApi) return;
  var btn = document.getElementById("aiInsightBtn");
  var out = document.getElementById("aiInsightOutput");
  var hint = document.getElementById("aiInsightHint");
  if (!btn || !out) return;
  btn.disabled = true;
  if (hint) hint.hidden = true;
  out.hidden = false;
  out.textContent = "Thinking...";
  var prompt = buildAiPrompt();
  sampleApi(prompt, {
    modelTier: "quick",
    onText: function(u){ out.textContent = u.text; }
  }).then(function(res){
    out.textContent = res.text;
    btn.disabled = false;
    btn.textContent = "Refresh insights";
  }).catch(function(e){
    if (e && e.code === "not_granted"){
      out.hidden = true;
      if (hint){ hint.hidden = false; hint.textContent = "AI insights aren't available in this view."; }
      btn.hidden = true;
      return;
    }
    out.textContent = (e && e.text) ? e.text : "Couldn't get insights just now — try again in a bit.";
    btn.disabled = false;
  });
}
function buildReportHtml(){
  var now = Date.now();
  var todaySec = secondsOn(startOfDay(now));
  var cmp = computeComparison();
  var allSec = STATE.sessions.reduce(function(a,s){ return a + s.durationSec; }, 0);
  var allCount = STATE.sessions.length;
  var streak = computeStreak();
  var best = computeBestStreak();
  var goals = getGoals();
  var distAll = subjectDistribution(STATE.sessions);
  var totalDist = distAll.reduce(function(a,d){ return a+d.sec; }, 0) || 1;
  var days = last7DayStarts();

  var subjectRows = distAll.map(function(d){
    var pct = Math.round((d.sec/totalDist)*1000)/10;
    var count = STATE.sessions.filter(function(s){ return (s.subjectName||"") === d.name; }).length;
    return '<tr><td>' + escapeHtml(d.name) + '</td><td>' + fmtDuration(d.sec) + '</td><td>' + pct + '%</td><td>' + count + '</td></tr>';
  }).join("");

  var dayRows = days.map(function(d){
    return '<tr><td>' + escapeHtml(longDateLabel(d)) + '</td><td>' + fmtDuration(secondsOn(d)) + '</td></tr>';
  }).join("");

  var goalLines = "";
  if (goals.dailyMinutes != null) goalLines += '<p>Daily goal: ' + goals.dailyMinutes + ' min &middot; today ' + fmtMinutesShort(todaySec) + '</p>';
  if (goals.weeklyMinutes != null) goalLines += '<p>Weekly goal: ' + goals.weeklyMinutes + ' min &middot; this week ' + fmtMinutesShort(cmp.week.cur) + '</p>';

  return (
    '<!doctype html><html><head><meta charset="utf-8"><title>Study Tracker Report</title><style>' +
    'body{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;max-width:640px;margin:32px auto;padding:0 20px;color:#20242B;background:#fff;}' +
    'h1{font-size:22px;margin-bottom:2px;}' +
    '.sub{color:#6b7280;font-size:13px;margin-bottom:24px;}' +
    'h2{font-size:15px;margin:28px 0 10px;border-bottom:1px solid #e3e5ea;padding-bottom:6px;}' +
    '.grid{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:8px;}' +
    '.tile{flex:1;min-width:120px;background:#F4F5F8;border-radius:10px;padding:12px 14px;}' +
    '.tile .label{font-size:11px;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;}' +
    '.tile .val{font-size:18px;font-weight:700;margin-top:2px;}' +
    'table{width:100%;border-collapse:collapse;font-size:13px;}' +
    'th{text-align:left;color:#6b7280;font-weight:600;font-size:11px;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid #e3e5ea;}' +
    'td{padding:6px 8px;border-bottom:1px solid #eef0f3;}' +
    'footer{margin-top:32px;color:#9aa0ab;font-size:11px;}' +
    '</style></head><body>' +
    '<h1>Study Tracker Report</h1>' +
    '<div class="sub">Generated ' + escapeHtml(longDateLabel(now)) + '</div>' +
    '<div class="grid">' +
      '<div class="tile"><div class="label">Today</div><div class="val">' + fmtDuration(todaySec) + '</div></div>' +
      '<div class="tile"><div class="label">Last 7 days</div><div class="val">' + fmtDuration(cmp.week.cur) + '</div></div>' +
      '<div class="tile"><div class="label">This month</div><div class="val">' + fmtDuration(cmp.month.cur) + '</div></div>' +
      '<div class="tile"><div class="label">All time</div><div class="val">' + fmtDuration(allSec) + '</div></div>' +
    '</div>' +
    '<div class="grid">' +
      '<div class="tile"><div class="label">Current streak</div><div class="val">' + streak + (streak===1?" day":" days") + '</div></div>' +
      '<div class="tile"><div class="label">Best streak</div><div class="val">' + best + (best===1?" day":" days") + '</div></div>' +
      '<div class="tile"><div class="label">Total sessions</div><div class="val">' + allCount + '</div></div>' +
    '</div>' +
    (goalLines ? ('<h2>Goals</h2>' + goalLines) : "") +
    '<h2>Last 7 Days</h2>' +
    '<table><thead><tr><th>Day</th><th>Time</th></tr></thead><tbody>' + dayRows + '</tbody></table>' +
    '<h2>Subject Breakdown (All Time)</h2>' +
    '<table><thead><tr><th>Subject</th><th>Time</th><th>Share</th><th>Sessions</th></tr></thead><tbody>' + subjectRows + '</tbody></table>' +
    '<footer>Exported from Study Tracker.</footer>' +
    '</body></html>'
  );
}
function runExportReport(){
  if (!downloadsApi) return;
  var btn = document.getElementById("exportReportBtn");
  if (btn) btn.disabled = true;
  var html = buildReportHtml();
  downloadsApi.save({ filename: "study-report-" + dateKey(Date.now()) + ".html", data: html })
    .then(function(){
      showToast("Report downloaded.");
      if (btn) btn.disabled = false;
    })
    .catch(function(err){
      if (btn) btn.disabled = false;
      if (!err || (err.code !== "declined" && err.code !== "rate_limited")) showToast("Couldn't download the report just now.");
    });
}

/* ---------- persistence ---------- */

/* ---------- toast ---------- */
function showToast(msg){
  var root = document.getElementById("toastRoot");
  root.textContent = msg;
  root.className = "toast show";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ root.className = "toast"; }, 2600);
}

/* ---------- confirm modal ---------- */
function showConfirm(opts){
  var root = document.getElementById("modalRoot");
  root.innerHTML =
    '<div class="modal-backdrop" id="modalBackdrop">' +
      '<div class="modal-card" role="dialog" aria-modal="true">' +
        '<h3 class="modal-title">' + escapeHtml(opts.title) + '</h3>' +
        '<p class="modal-body">' + escapeHtml(opts.body) + '</p>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-ghost" id="modalCancel">Cancel</button>' +
          '<button class="btn ' + (opts.danger ? "btn-danger" : "btn-primary") + '" id="modalConfirm">' + escapeHtml(opts.confirmLabel || "Confirm") + '</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.getElementById("modalCancel").onclick = closeModal;
  document.getElementById("modalBackdrop").onclick = function(e){ if (e.target.id === "modalBackdrop") closeModal(); };
  document.getElementById("modalConfirm").onclick = function(){ closeModal(); opts.onConfirm(); };
}
function closeModal(){ document.getElementById("modalRoot").innerHTML = ""; }

function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}

/* ---------- icons ---------- */
var ICONS = {
  timer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l3 2"></path><path d="M9 2h6"></path></svg>',
  stats: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"></path><path d="M12 20V4"></path><path d="M20 20v-7"></path></svg>',
  history: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><path d="M3 4v4h4"></path><path d="M12 8v5l3 2"></path></svg>',
  subjects: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 12.9 12.9 20.6a1.9 1.9 0 0 1-2.7 0l-6.8-6.8a1.9 1.9 0 0 1 0-2.7L11.1 3.4a1.9 1.9 0 0 1 1.3-.5H18a2 2 0 0 1 2 2v5.7a1.9 1.9 0 0 1-.5 1.3z"></path><circle cx="14.5" cy="8.5" r="1.2" fill="currentColor" stroke="none"></circle></svg>',

function activeElapsedSec(){
  var a = STATE.activeSession;
  if (!a) return 0;
  var running = a.isPaused ? 0 : (Date.now() - a.startedAt)/1000;
  return a.accumulatedSec + running;
}



function onPause(){
  var a = STATE.activeSession; if (!a || a.isPaused) return;
  a.accumulatedSec = activeElapsedSec();
  a.isPaused = true;
  persist(); render();
}
function onResume(){
  var a = STATE.activeSession; if (!a || !a.isPaused) return;
  a.startedAt = Date.now();
  a.isPaused = false;
  persist(); render();
}

var HOUR_PX = 48;
function minutesToY(min){ return (min/60)*HOUR_PX; }
function yToMinutes(y){ return (y/HOUR_PX)*60; }
function hourLabel12(h){
  var ampm = h < 12 ? "AM" : "PM";
  var h12 = h % 12; if (h12 === 0) h12 = 12;
  return h12 + " " + ampm;
}
function timeLabelFromMinutes(min){
  min = ((min % 1440) + 1440) % 1440;
  var h = Math.floor(min/60), m = min%60;
  var ampm = h >= 12 ? "PM" : "AM";
  var h12 = h % 12; if (h12 === 0) h12 = 12;
  return h12 + ":" + pad2(m) + " " + ampm;
}
function timeRangeLabel(startMin, endMin){
  return timeLabelFromMinutes(startMin) + "–" + timeLabelFromMinutes(endMin);
}
function minutesToTimeValue(min){
  var h = Math.floor(min/60), m = min%60;
  return pad2(h) + ":" + pad2(m);
}
function timeValueToMinutes(val){
  if (!val) return NaN;
  var parts = val.split(":");
  return parseInt(parts[0],10)*60 + parseInt(parts[1],10);
}

function renderTodoView(){
  var todos = STATE.todos || [];
  var today = todayKey();
  var scheduledToday = todos.filter(function(t){ return t.scheduled && t.scheduled.date === today; })
    .sort(function(a,b){ return a.scheduled.startMin - b.scheduled.startMin; });
  var rest = todos.filter(function(t){ return !(t.scheduled && t.scheduled.date === today); })
    .sort(function(a,b){
      if (a.done !== b.done) return a.done ? 1 : -1;
      return b.createdAt - a.createdAt;
    });

  var addRow =
    '<div class="card">' +
      '<div class="add-todo-row">' +
        '<input type="text" id="newTodoText" placeholder="Add a task" maxlength="80">' +
        '<button class="btn btn-primary btn-sm" id="addTodoBtn">' + ICONS.plus + 'Add</button>' +
      '</div>' +
    '</div>';

  var timelineCard = renderTodoTimeline(scheduledToday);

  var hasCompleted = todos.some(function(t){ return t.done; });
  var checklistRows = rest.map(renderTodoRow).join("") || '<p class="hint">No other tasks. Add one above.</p>';
  var checklistCard =
    '<div class="card">' +
      '<div class="card-header"><span>Tasks</span></div>' +
      checklistRows +
      (hasCompleted ? '<button class="btn btn-ghost btn-sm todo-clear-btn" id="clearCompletedTodos">Clear completed</button>' : '') +
    '</div>';

  return addRow + timelineCard + checklistCard;
}



function addTodoFromInput(){
  var input = document.getElementById("newTodoText");
  var name = input.value.trim();
  if (!name) { showToast("Give the task a name."); return; }
  STATE.todos.push({ id: uid(), text: name, done: false, createdAt: Date.now(), scheduled: null });
  input.value = "";
  persist(); render();
}

function wireTodoView(){
  var addBtn = document.getElementById("addTodoBtn");
  if (addBtn) addBtn.onclick = addTodoFromInput;
  var newInput = document.getElementById("newTodoText");
  if (newInput) newInput.addEventListener("keydown", function(e){ if (e.key === "Enter") addTodoFromInput(); });

  Array.prototype.forEach.call(document.querySelectorAll("[data-todo-check]"), function(btn){
    btn.addEventListener("pointerdown", function(e){ e.stopPropagation(); });
    btn.onclick = function(e){
      e.stopPropagation();
      var t = findTodo(btn.getAttribute("data-todo-check"));

      persist(); render();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-todo-del]"), function(btn){
    btn.onclick = function(){

      showConfirm({

  Array.prototype.forEach.call(document.querySelectorAll("[data-todo-edit]"), function(el){
    el.onclick = function(){ showEditTodoModal(el.getAttribute("data-todo-edit")); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-todo-block]"), function(el){
    wireTodoBlockDrag(el, el.getAttribute("data-todo-block"));
  });
  var clearBtn = document.getElementById("clearCompletedTodos");
  if (clearBtn) clearBtn.onclick = function(){
    STATE.todos = STATE.todos.filter(function(t){ return !t.done; });
    persist(); render();
  };
  var scrollEl = document.querySelector(".timeline-scroll");
  if (scrollEl){
    var nowMin = new Date().getHours()*60 + new Date().getMinutes();
    scrollEl.scrollTop = Math.max(0, minutesToY(nowMin) - 100);
  }
}

function wireTodoBlockDrag(el, id){
  var dragging = false, moved = false, startY = 0, startTop = 0;
  el.addEventListener("pointerdown", function(e){
    dragging = true; moved = false;
    startY = e.clientY;
    startTop = parseFloat(el.style.top) || 0;
    try { el.setPointerCapture(e.pointerId); } catch(err){}
    el.classList.add("dragging");
  });
  el.addEventListener("pointermove", function(e){
    if (!dragging) return;
    var dy = e.clientY - startY;
    if (Math.abs(dy) > 4) moved = true;
    var track = el.parentElement;
    var maxTop = Math.max(0, track.clientHeight - el.offsetHeight);
    var newTop = Math.min(maxTop, Math.max(0, startTop + dy));
    el.style.top = newTop + "px";
  });
  function endDrag(){
    if (!dragging) return;
    dragging = false;
    el.classList.remove("dragging");
    if (!moved){
      showEditTodoModal(id);
      return;
    }
    var t = findTodo(id);
    if (!t || !t.scheduled) { render(); return; }
    var top = parseFloat(el.style.top) || 0;
    var minutes = Math.round(Math.round(yToMinutes(top)) / 5) * 5;
    minutes = Math.max(0, Math.min(1440 - t.scheduled.durMin, minutes));
    t.scheduled.startMin = minutes;
    persist(); render();
  }
  el.addEventListener("pointerup", endDrag);
  el.addEventListener("pointercancel", endDrag);
}

function showEditTodoModal(id){
  var t = findTodo(id);
  if (!t) return;
  var hasSchedule = !!t.scheduled;
  var startVal = hasSchedule ? minutesToTimeValue(t.scheduled.startMin) : "09:00";
  var durVal = hasSchedule ? t.scheduled.durMin : 30;
  var root = document.getElementById("modalRoot");
  root.innerHTML =
    '<div class="modal-backdrop" id="modalBackdrop">' +
      '<div class="modal-card" role="dialog" aria-modal="true">' +
        '<h3 class="modal-title">Edit Task</h3>' +
        '<div class="form-field"><label>Task</label><input type="text" id="editTodoText" maxlength="80" value="' + escapeHtml(t.text) + '"></div>' +
        '<label class="check-row"><input type="checkbox" id="editTodoScheduleToggle"' + (hasSchedule?" checked":"") + '><span>Give this a time slot today</span></label>' +
        '<div class="form-row" id="editTodoScheduleFields"' + (hasSchedule?"":' style="display:none;"') + '>' +
          '<div class="form-field"><label>Start</label><input type="time" id="editTodoStart" value="' + startVal + '"></div>' +
          '<div class="form-field"><label>Minutes</label><input type="number" min="5" max="720" step="5" id="editTodoDur" value="' + durVal + '"></div>' +
        '</div>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-ghost" id="modalCancel">Cancel</button>' +
          '<button class="btn btn-primary" id="modalSaveTodo">Save</button>' +
        '</div>' +
        '<button class="btn btn-danger btn-sm modal-delete" id="modalDeleteTodo">Delete task</button>' +
      '</div>' +
    '</div>';
  document.getElementById("modalCancel").onclick = closeModal;
  document.getElementById("modalBackdrop").onclick = function(e){ if (e.target.id === "modalBackdrop") closeModal(); };
  var toggle = document.getElementById("editTodoScheduleToggle");
  var fields = document.getElementById("editTodoScheduleFields");
  toggle.onchange = function(){ fields.style.display = toggle.checked ? "" : "none"; };
  document.getElementById("modalSaveTodo").onclick = function(){
    var text = document.getElementById("editTodoText").value.trim();
    if (!text) { showToast("Give the task a name."); return; }
    t.text = text;
    if (toggle.checked){
      var startMin = timeValueToMinutes(document.getElementById("editTodoStart").value);
      if (isNaN(startMin)) startMin = 9*60;
      var dur = parseInt(document.getElementById("editTodoDur").value, 10);
      if (isNaN(dur) || dur < 5) dur = 5;
      if (startMin + dur > 1440) dur = Math.max(5, 1440 - startMin);
      t.scheduled = { date: todayKey(), startMin: startMin, durMin: dur };
    } else {
      t.scheduled = null;
    }
    closeModal();
    persist(); render();
  };
  document.getElementById("modalDeleteTodo").onclick = function(){
    closeModal();
    showConfirm({
      title: "Delete this task?",
      body: "This can't be undone.",
      confirmLabel: "Delete",
      danger: true,
      onConfirm: function(){
        STATE.todos = STATE.todos.filter(function(x){ return x.id !== id; });
        persist(); render();
      }
    });
  };
}

function toDatetimeLocalValue(ts){
  var d = new Date(ts);
  return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()) + "T" + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
function showEditSessionModal(id){

        '<div class="modal-actions">' +
          '<button class="btn btn-ghost" id="modalCancel">Cancel</button>' +
          '<button class="btn btn-primary" id="modalSaveEdit">Save</button>' +
        '</div>' +
        '<button class="btn btn-danger btn-sm modal-delete" id="modalDeleteSession">Delete session</button>' +
      '</div>' +
    '</div>';
  document.getElementById("modalCancel").onclick = closeModal;
  document.getElementById("modalBackdrop").onclick = function(e){ if (e.target.id === "modalBackdrop") closeModal(); };
  document.getElementById("modalSaveEdit").onclick = function(){
    var subjSel = document.getElementById("editSubject");
    var subj = findSubject(subjSel.value) || { id: s.subjectId, name: s.subjectName, hue: s.subjectHue };
    var m = parseInt(document.getElementById("editMin").value, 10); if (isNaN(m) || m < 0) m = 0;
    var sec = parseInt(document.getElementById("editSec").value, 10); if (isNaN(sec) || sec < 0) sec = 0;
    var durationSec = Math.max(1, m*60 + sec);
    var startVal = document.getElementById("editStart").value;
    var startedAt = startVal ? new Date(startVal).getTime() : s.startedAt;
    if (isNaN(startedAt)) startedAt = s.startedAt;
    var note = document.getElementById("editNote").value.trim();
    s.subjectId = subj.id; s.subjectName = subj.name; s.subjectHue = subj.hue;
    s.durationSec = durationSec;

    s.endedAt = startedAt + durationSec*1000;
    s.note = note;
    s.completed = (s.mode === "countdown") ? (s.plannedSec ? durationSec >= s.plannedSec : true) : true;

/* The moment you press Start: your subject's color floods the screen with what's at stake

  if (secondsOn(today) === 0 && streak > 0) options.push("Day " + (streak+1) + " of your streak starts here.");
  if (targets[0]) options.push(fmtDuration(targets[0].at) + " gets you to " + targets[0].label + ".");
  var best = targets.filter(function(x){ return x.big; })[0];
  if (best) options.push(fmtDuration(best.at) + " to " + best.label + ". Today could be the day.");
  var sec = secondsOn(today);
  if (sec > 0) options.push("Layer " + (sessionsOn(today).length+1) + " today, on top of " + fmtDuration(sec) + ".");

function playCurtain(a){

/* ---------- suggestions ---------- */
function daysSinceSubject(name){
  var today = startOfDay(Date.now()), latest = 0;
  STATE.sessions.forEach(function(s){ if (s.subjectName === name && s.startedAt > latest) latest = s.startedAt; });
  if (!latest) return null;
  return Math.round((today - startOfDay(latest))/86400000);
}
function resumeSuggestions(){
  var out = [], seen = {};
  /* only a subject that's truly overdue for you, by your own habit */
  var stale = null;
  STATE.subjects.forEach(function(s){
    var d = overdueDays(s);
    if (d != null && (!stale || d > stale.days)) stale = { subject: s, days: d };
  });
  STATE.sessions.slice().sort(function(a,b){ return b.startedAt - a.startedAt; }).some(function(x){
    var subj = findSubject(x.subjectId);
    if (!subj || rhythmOf(subj) === "finished" || (stale && stale.subject.id === subj.id)) return false;
    var key = x.subjectName + "|" + (x.note || "").toLowerCase();
    if (seen[key]) return false;
    seen[key] = true;
    out.push({ subject: subj, note: x.note || "", when: x.startedAt });
    return out.length >= 3;
  });
  if (stale) out.push({ subject: stale.subject, note: "", stale: stale.days });
  return out;
}

function onGlobalKey(e){
  if (e.key === "Escape"){
    if ($("recapRoot").firstChild){ closeRecap(); return; }
    if ($("modalRoot").firstChild){ closeModal(); return; }
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){
    e.preventDefault();
    if (!STATE.activeSession){ UI.tab = "timer"; render(); var q = $("quickInput"); if (q) q.focus(); }
    return;
  }
  var tag = (e.target && e.target.tagName) || "";
  if (/INPUT|SELECT|TEXTAREA/.test(tag) || e.metaKey || e.ctrlKey || e.altKey) return;
  if ($("modalRoot").firstChild) return;
  if ($("recapRoot").firstChild){
    if (e.key === "ArrowRight" || e.key === " "){ e.preventDefault(); recapStep(1); }
    if (e.key === "ArrowLeft") recapStep(-1);
    return;
  }
  var tabs = { "1":"timer", "2":"stats", "3":"todo", "4":"history" };
  if (tabs[e.key]){ UI.tab = tabs[e.key]; render(); return; }
  if (e.key === "/" && !STATE.activeSession){ e.preventDefault(); UI.tab = "timer"; render(); var qi = $("quickInput"); if (qi) qi.focus(); return; }
  if (UI.tab === "timer" && STATE.activeSession){
    if (e.key === " " && !/BUTTON/.test(tag)){ e.preventDefault(); if (STATE.activeSession.isPaused) onResume(); else onPause(); }
    if (e.key.toLowerCase() === "e") onEndClick();
  }
}

/* seconds per weekday and hour, spreading each session across the hours it covered */
function rhythmGrid(){

  for (i=0;i<7;i++){ g.push([]); for (j=0;j<24;j++) g[i].push(0); }
  STATE.sessions.forEach(function(s){
    var left = s.durationSec, t = s.startedAt;
    while (left > 0){
      var d = new Date(t), into = d.getMinutes()*60 + d.getSeconds(), take = Math.min(left, 3600-into);

      left -= take; t += take*1000;

var WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function rhythmFinding(){
  var g = rhythmGrid(), bd = 0, bh = 0, total = 0, hourTotals = [], i, j;
  for (j=0;j<24;j++) hourTotals[j] = 0;
  for (i=0;i<7;i++) for (j=0;j<24;j++){ total += g[i][j]; hourTotals[j] += g[i][j]; if (g[i][j] > g[bd][bh]){ bd = i; bh = j; } }
  if (!total) return { grid: g, html: "", plain: "not enough data" };
  /* the busiest three-hour stretch of the day */
  var bestStart = 0, bestSum = -1;
  for (j=0;j<24;j++){ var sum = hourTotals[j] + hourTotals[(j+1)%24] + hourTotals[(j+2)%24]; if (sum > bestSum){ bestSum = sum; bestStart = j; } }
  var share = Math.round(bestSum/total*100);
  var range = hourName(bestStart) + " to " + hourName((bestStart+3)%24);
  return {
    grid: g, peakDay: bd, peakHour: bh, range: range, share: share,
    html: "<b>" + share + "% of your studying happens from " + range + ".</b> Your busiest slot is " + WEEKDAYS[bd] + " around " + hourName(bh) + ".",
    plain: share + "% of study time falls between " + range + "; busiest slot is " + WEEKDAYS[bd] + " around " + hourName(bh)
  };
}

/* ============================================================
   STANDALONE APP (iPhone home screen and Mac)
   No Claude page to save into: data lives on the device and syncs
   through the owner's private database.
============================================================ */
var APP_CONFIG = window.STUDY_TRACKER_CONFIG || {};

/* Three-way merge against the last copy both sides agreed on, so an edit or a
   delete made on one device survives a sync with the other. */
/* Compare by content: the database stores fields in its own order. */
function canon(v){
  if (Array.isArray(v)) return v.map(canon);
  if (v && typeof v === "object"){
    var o = {};
    Object.keys(v).sort().forEach(function(k){ if (v[k] !== undefined) o[k] = canon(v[k]); });
    return o;
  }
  return v;
}
function jsonEq(a, b){ return JSON.stringify(canon(a)) === JSON.stringify(canon(b)); }
function mergeList(base, local, remote){
  function index(list){ var m = {}; (list || []).forEach(function(x){ m[x.id] = x; }); return m; }
  var B = index(base), L = index(local), R = index(remote), out = [], seen = {};
  function pick(id){
    if (seen[id]) return; seen[id] = true;
    var b = B[id], l = L[id], r = R[id];
    if (l && r){ out.push(b && jsonEq(l, b) ? r : l); return; }  /* changed here wins; otherwise take theirs */
    if (l){ if (!b || !jsonEq(l, b)) out.push(l); return; }      /* new here, or edited here after a delete there */
    if (r){ if (!b || !jsonEq(r, b)) out.push(r); }              /* new there, or edited there after a delete here */
  }
  (local || []).forEach(function(x){ pick(x.id); });
  (remote || []).forEach(function(x){ pick(x.id); });
  return out;
}
function mergeValue(base, local, remote){ return jsonEq(local, base) ? remote : local; }
function threeWayMerge(base, local, remote){
  base = base || { subjects: [], sessions: [], todos: [], activeSession: null, goals: null };
  if (!remote) return local;
  var out = {
    version: 1,
    subjects: mergeList(base.subjects, local.subjects, remote.subjects),
    sessions: mergeList(base.sessions, local.sessions, remote.sessions),
    todos: mergeList(base.todos, local.todos, remote.todos),
    activeSession: mergeValue(base.activeSession || null, local.activeSession || null, remote.activeSession || null),
    goals: mergeValue(base.goals || null, local.goals || null, remote.goals || null) || { dailyMinutes: null, weeklyMinutes: null }
  };
  out.sessions.sort(function(a,b){ return b.startedAt - a.startedAt; });
  /* a timer logged anywhere is finished everywhere */
  if (out.activeSession && out.sessions.some(function(s){ return s.id === out.activeSession.id; })) out.activeSession = null;
  return out;
}

/* Two older sessions share an id (different subjects, same minute). Sync matches by id,
   so give any repeat its own stable id instead of losing it. Every device gets the same result. */
function uniqueSessionIds(state){
  var seen = {}, count = {};
  (state.sessions || []).forEach(function(s){
    if (seen[s.id]){
      count[s.id] = (count[s.id] || 1) + 1;
      s.id = s.id + "-" + count[s.id];
    }
    seen[s.id] = true;
  });
  return state;
}

/* ---------- private database (Supabase's plain web API, no library) ---------- */
var AUTH_KEY = "study-tracker-auth-v1", BASE_KEY = "study-tracker-base-v1";
var Sync = {
  auth: null, base: null, rev: null, busy: false, again: false, lastOk: 0, lastError: "", timer: null, pendingRender: false,
  configured: function(){ return !!(APP_CONFIG.url && APP_CONFIG.key); },
  load: function(){
    try { this.auth = JSON.parse(localStorage.getItem(AUTH_KEY)); } catch(e){}
    try { var b = JSON.parse(localStorage.getItem(BASE_KEY)); if (b){ this.base = b.state; this.rev = b.rev; } } catch(e){}
  },
  saveAuth: function(){ try { if (this.auth) localStorage.setItem(AUTH_KEY, JSON.stringify(this.auth)); else localStorage.removeItem(AUTH_KEY); } catch(e){} },
  saveBase: function(){ try { localStorage.setItem(BASE_KEY, JSON.stringify({ state: this.base, rev: this.rev })); } catch(e){} },
  setTokens: function(d){
    this.auth = { access: d.access_token, refresh: d.refresh_token, exp: Date.now() + (d.expires_in || 3600)*1000, email: (d.user && d.user.email) || (this.auth && this.auth.email) || "" };
    this.saveAuth();
  },
  authCall: function(grant, body){
    var self = this;
    return fetch(APP_CONFIG.url + "/auth/v1/token?grant_type=" + grant, {
      method: "POST", headers: { apikey: APP_CONFIG.key, "Content-Type": "application/json" }, body: JSON.stringify(body)
    }).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ d.__status = r.status; return d; }); })
      .then(function(d){ if (d.__status >= 400){ var e = new Error(d.error_description || d.msg || d.message || "Sign-in failed"); e.status = d.__status; throw e; } self.setTokens(d); return d; });
  },
  token: function(){
    var self = this;
    if (!this.auth) return Promise.reject(new Error("signed out"));
    if (Date.now() < this.auth.exp - 60000) return Promise.resolve(this.auth.access);
    return this.authCall("refresh_token", { refresh_token: this.auth.refresh }).then(function(){ return self.auth.access; }).catch(function(e){
      if (e.status === 400 || e.status === 401){ self.auth = null; self.saveAuth(); self.showGate(); }
      throw e;
    });
  },
  rest: function(method, query, body, extra){
    return this.token().then(function(tok){
      var h = { apikey: APP_CONFIG.key, Authorization: "Bearer " + tok, "Content-Type": "application/json" };
      if (extra) Object.keys(extra).forEach(function(k){ h[k] = extra[k]; });
      return fetch(APP_CONFIG.url + "/rest/v1/study_state" + query, { method: method, headers: h, body: body ? JSON.stringify(body) : undefined });
    });
  },
  json: function(r){ if (!r.ok && r.status !== 409){ throw new Error("Server said " + r.status); } return r.status === 409 ? null : r.json(); },
  push: function(){ clearTimeout(this.timer); var self = this; this.timer = setTimeout(function(){ self.run(); }, 250); },
  /* Check the revision number first: it's tiny, so polling stays cheap. */
  poll: function(){
    var self = this;
    var native = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.timerState;
    if (!this.auth || this.busy || (document.hidden && !native)) return;
    this.rest("GET", "?select=rev").then(function(r){ return self.json(r); }).then(function(rows){
      var rev = rows && rows.length ? rows[0].rev : null;
      if (rev !== self.rev) self.run();
      else { self.lastOk = Date.now(); self.lastError = ""; self.updateStatus(); }
    }).catch(function(e){ self.lastError = e.message; self.updateStatus(); });
  },
  run: function(attempt){
    var self = this;
    if (!this.auth) return;
    if (this.busy){ this.again = true; return; }
    this.busy = true; attempt = attempt || 0;
    var done = function(){ self.busy = false; self.updateStatus(); if (self.again){ self.again = false; self.run(); } };
    this.rest("GET", "?select=state,rev").then(function(r){ return self.json(r); }).then(function(rows){
      var row = rows && rows[0];
      var localSnap = JSON.parse(JSON.stringify(STATE));
      var merged = threeWayMerge(self.base, localSnap, row ? row.state : null);
      var finish = function(rev){
        self.base = JSON.parse(JSON.stringify(merged)); self.rev = rev; self.saveBase();
        self.lastOk = Date.now(); self.lastError = "";
        /* keep anything typed while this was in flight for the next round */
        if (!jsonEq(STATE, localSnap)){ self.again = true; return; }
        if (!jsonEq(STATE, merged)){ STATE = merged; saveLocalBackup(STATE); self.refreshUI(); }
        if (applySubjectDefaults()){ saveLocalBackup(STATE); self.again = true; self.refreshUI(); }
      };
      if (row && jsonEq(row.state, merged)){ finish(row.rev); return; }
      if (!row && !stateHasData(merged)){
        /* Brand new database and an empty device: the Mac app carries your sessions to load once.
           Only ever runs when there's nothing to overwrite. The iPhone copy has no such file. */
        return fetch("seed.json").then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }).then(function(seed){

          saveLocalBackup(STATE); self.again = true; self.refreshUI();
          showToast("Loaded your " + plural(STATE.sessions.length, "session") + ".");
        });
      }
      var write = row
        ? self.rest("PATCH", "?rev=eq." + row.rev, { state: merged, rev: row.rev + 1, updated_at: new Date().toISOString() }, { Prefer: "return=representation" })
        : self.rest("POST", "", { state: merged, rev: 1 }, { Prefer: "return=representation" });
      return write.then(function(r){ return self.json(r); }).then(function(res){
        if (!res || !res.length){ throw { retry: true }; }  /* another device saved first */
        finish(res[0].rev);
      });
    }).then(done).catch(function(e){
      self.busy = false;
      if (e && e.retry && attempt < 4){ self.run(attempt + 1); return; }
      self.lastError = (e && e.message) || "Couldn't reach the server";
      self.updateStatus();
    });
  },
  refreshUI: function(){
    var a = document.activeElement;
    if (!STATE.activeSession && $("wrapTime")) closeModal();
    if (a && a.tagName === "INPUT" && $("content").contains(a)){ this.pendingRender = true; return; }
    render();
  },
  statusText: function(){
    if (!this.configured()) return "Sync isn't set up on this device.";
    if (!this.auth) return "Signed out. Sessions stay on this device until you sign in.";
    if (this.lastError) return "Offline or can't sync right now. Your work is saved here and will sync when it connects.";
    if (!this.lastOk) return "Syncing...";
    if (!stateHasData(STATE)) return "Signed in" + (this.auth.email ? " as " + this.auth.email : "") + ", but there are no sessions here yet.";
    var s = Math.round((Date.now() - this.lastOk)/1000);
    return "Synced " + (s < 60 ? "just now" : fmtDuration(s) + " ago") + (this.auth.email ? " as " + this.auth.email : "") + ".";
  },
  updateStatus: function(){ var el = $("syncStatus"); if (el) el.textContent = this.statusText(); },
  showGate: function(){
    if (!this.configured() || $("signIn")) return;
    $("modalRoot").innerHTML =
      '<div class="modal-backdrop"><form class="modal-card" id="signIn" role="dialog" aria-modal="true" aria-labelledby="signInTitle">' +
        '<h3 class="modal-title" id="signInTitle">Sign in to sync</h3>' +
        '<p class="modal-body">Use the email and password from your Study Tracker database. Your sessions then follow you between devices.</p>' +
        '<div class="form-field"><label for="siEmail">Email</label><input id="siEmail" type="email" autocomplete="username" required></div>' +
        '<div class="form-field"><label for="siPass">Password</label><input id="siPass" type="password" autocomplete="current-password" required></div>' +
        '<p class="hint" id="siError" role="alert"></p>' +
        '<div class="modal-actions"><button type="button" class="btn" id="siSkip">Not now</button><button type="submit" class="btn btn-primary" id="siGo">Sign in</button></div>' +
      '</form></div>';
    var self = this;
    $("siSkip").onclick = function(){ closeModal(); };
    $("signIn").onsubmit = function(e){
      e.preventDefault();
      var go = $("siGo"); go.disabled = true;
      self.authCall("password", { email: $("siEmail").value.trim(), password: $("siPass").value }).then(function(){
        closeModal(); self.run(); showToast("Signed in. Syncing your sessions.");
      }).catch(function(err){
        go.disabled = false;
        $("siError").textContent = err.status === 400 ? "That email or password didn't match. Try again." : "Couldn't reach the server. Check your connection and try again.";
      });
    };
  },
  start: function(){
    var self = this;
    this.load();
    if (!this.configured()) return;
    if (!this.auth) this.showGate(); else this.run();
    setInterval(function(){
      if (self.pendingRender && !(document.activeElement && document.activeElement.tagName === "INPUT")){ self.pendingRender = false; render(); }
      self.poll();
    }, 15000);
    document.addEventListener("visibilitychange", function(){ if (!document.hidden) self.run(); });
    window.addEventListener("online", function(){ self.run(); });
  }
};

/* First-time defaults for subjects that only come up now and then. Anything you
   choose yourself in Settings stays as you set it. */
function applySubjectDefaults(){
  var changed = false;
  STATE.subjects.forEach(function(s){
    if (!s.rhythm && /^(sat|leadership|college couns)/i.test(s.name)){ s.rhythm = "asneeded"; changed = true; }
  });
  return changed;
}

/* ---------- Mac menu bar: tell the native side what the timer is doing ---------- */
function notifyNative(){
  var h = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.timerState;
  if (!h) return;
  var a = STATE.activeSession;
  h.postMessage(a ? { name: a.subjectName, mode: a.mode, planned: a.plannedSec || 0, acc: a.accumulatedSec, started: a.startedAt, paused: !!a.isPaused } : { name: "" });
}

/* ---------- saving ---------- */
function persist(){
  saveLocalBackup(STATE);
  Sync.push();
}

/* ---------- save a file: native panel on Mac, normal download elsewhere ---------- */
function saveFile(o){
  var native = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.saveFile;
  if (native){ native.postMessage({ filename: o.filename, data: o.data }); return Promise.resolve(); }
  var url = URL.createObjectURL(new Blob([o.data], { type: /html$/.test(o.filename) ? "text/html" : "application/json" }));
  var a = document.createElement("a"); a.href = url; a.download = o.filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 30000);
  return Promise.resolve();
}
downloadsApi = { save: saveFile };
capsReady.downloads = true;

/* ---------- settings: sync and restore instead of the Claude page text ---------- */
function standaloneDataCard(){
  return '<div class="card"><div class="card-header"><span>Your data</span></div>' +
    '<p class="hint" id="syncStatus">' + escapeHtml(Sync.statusText()) + '</p>' +
    '<div class="btn-row">' +
      (Sync.configured() ? (Sync.auth ? '<button class="btn btn-sm" id="syncNow">Sync now</button><button class="btn btn-sm" id="signOut">Sign out</button>' : '<button class="btn btn-sm btn-primary" id="signInBtn">Sign in</button>') : '') +
      '<button class="btn btn-sm" id="backupBtn">Download a backup</button>' +
      '<label class="btn btn-sm" for="restoreFile" style="cursor:pointer">Restore from a backup</label><input id="restoreFile" type="file" accept=".json,application/json" style="display:none">' +
      '<button class="btn btn-danger btn-sm" id="clearDataBtn">Clear all data</button>' +
    '</div></div>';
}
function wireStandaloneData(){
  var el;
  if ((el = $("syncNow"))) el.onclick = function(){ Sync.run(); showToast("Syncing."); };
  if ((el = $("signInBtn"))) el.onclick = function(){ Sync.showGate(); };
  if ((el = $("signOut"))) el.onclick = function(){
    showConfirm({ title: "Sign out?", body: "Your sessions stay on this device, but stop syncing until you sign in again.", confirmLabel: "Sign out", onConfirm: function(){
      Sync.auth = null; Sync.saveAuth(); render();
    } });
  };
  if ((el = $("restoreFile"))) el.onchange = function(){
    var f = el.files && el.files[0]; if (!f) return;
    f.text().then(function(txt){
      var data = JSON.parse(txt);
      if (!data || !Array.isArray(data.sessions) || !Array.isArray(data.subjects)) throw new Error("bad");
      var before = STATE.sessions.length;
      STATE = mergeStates(STATE, uniqueSessionIds(data));
      persist(); render();
      showToast("Added " + plural(STATE.sessions.length - before, "session") + " from the backup.");
    }).catch(function(){ showToast("That file isn't a Study Tracker backup. Choose a backup .json file."); });
  };
}

/* ---------- keep the screen awake while a timer runs (where the device allows it) ---------- */
var wakeLock = null;
function syncWakeLock(){
  var want = STATE.activeSession && !STATE.activeSession.isPaused && !document.hidden;
  if (want && !wakeLock && navigator.wakeLock){
    navigator.wakeLock.request("screen").then(function(l){ wakeLock = l; l.addEventListener("release", function(){ wakeLock = null; }); }).catch(function(){});
  } else if (!want && wakeLock){ wakeLock.release().catch(function(){}); wakeLock = null; }
}
document.addEventListener("visibilitychange", syncWakeLock);
setInterval(syncWakeLock, 10000);

if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}

/* ---------- boot ---------- */
function boot(){
  applyTheme(getThemePref());
  restoreUIPref();
  buildShell();
  checkAway();
  render();
  var a = STATE.activeSession;
  if (a && a.mode === "countdown" && a.autoFinished){ UI.tab = "timer"; render(); showWrapModal(); }
  soundArm();
  showMoment();
  Sync.start();
  if (window.claude && typeof window.claude.use === "function"){
    window.claude.use("artifact").then(function(api){
      artifactApi = api; artifactChecked = true;
      if (!api) enterLocalOnlyMode();
      else maybeRecoverFromLocalBackup();
      applyOneTimeFixups();
    }).catch(function(){ artifactApi = null; artifactChecked = true; enterLocalOnlyMode(); applyOneTimeFixups(); });
    window.claude.use("sample").then(function(api){
      sampleApi = api || null; capsReady.sample = !!api;
      if (UI.tab === "stats") render();
    }).catch(function(){ sampleApi = null; });
    window.claude.use("downloads").then(function(api){
      downloadsApi = api || null; capsReady.downloads = !!api;
      if (UI.tab === "stats" || UI.tab === "settings") render();
    }).catch(function(){ downloadsApi = null; });
  } else {
    artifactApi = null; artifactChecked = true; enterLocalOnlyMode();
    applyOneTimeFixups();
  }
}

/* ============================================================
   BOOT
============================================================ */
function applyOneTimeFixups(){}
function stateHasData(s){
  return !!s && ((s.subjects && s.subjects.length) || (s.sessions && s.sessions.length) || (s.todos && s.todos.length));
}
/* Goals are a single settings object, not a growable list, so they merge
   field-by-field: whichever side has a real (non-null) value for a field
   wins, preferring the freshly-loaded side (base) so a successful publish
   from another device always takes precedence over a stale local backup,
   while still never letting a blank/never-set seed silently erase a goal
   that's only sitting in this browser's local mirror. */
function mergeGoals(a, b){
  a = a || {}; b = b || {};
  return {
    dailyMinutes: a.dailyMinutes != null ? a.dailyMinutes : (b.dailyMinutes != null ? b.dailyMinutes : null),
    weeklyMinutes: a.weeklyMinutes != null ? a.weeklyMinutes : (b.weeklyMinutes != null ? b.weeklyMinutes : null)
  };
}
function goalsDiffer(a, b){
  a = a || { dailyMinutes: null, weeklyMinutes: null };
  b = b || { dailyMinutes: null, weeklyMinutes: null };
  return a.dailyMinutes !== b.dailyMinutes || a.weeklyMinutes !== b.weeklyMinutes;
}
function enterLocalOnlyMode(){
  var backup = loadLocalBackup();
  if (!stateHasData(backup)) return;
  var merged = mergeStates(STATE, backup);
  if (merged.subjects.length !== STATE.subjects.length || !!merged.activeSession !== !!STATE.activeSession || merged.sessions.length !== STATE.sessions.length || merged.todos.length !== (STATE.todos || []).length || goalsDiffer(merged.goals, STATE.goals)){
    STATE = merged;
    render();
  }
}
/* Union-merge two states by id, so a code update that ships with a fresh
   (or hand-seeded) starting point never silently drops real data that is
   only sitting in this browser's local mirror — everything from both
   sides survives, deduped by id. */
/* Safety net for a code update that reset (or hand-seeded) the published
   page's starting data: if this browser's local mirror has sessions or
   subjects that aren't in what just loaded, merge them in and immediately
   re-save the combined result as the canonical version. */
function maybeRecoverFromLocalBackup(){
  var backup = loadLocalBackup();
  if (!stateHasData(backup)) return;
  var merged = mergeStates(STATE, backup);
  if (merged.subjects.length !== STATE.subjects.length || !!merged.activeSession !== !!STATE.activeSession || merged.sessions.length !== STATE.sessions.length || merged.todos.length !== (STATE.todos || []).length || goalsDiffer(merged.goals, STATE.goals)){
    STATE = merged;
    render();
    persist();
    showToast("Restored your saved sessions.");
  }
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

})();
</script>
